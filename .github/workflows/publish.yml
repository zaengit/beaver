name: Publish Beaver

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test --if-present

      - name: Publish package
        run: npm publish

      - name: Wait for package availability
        run: |
          BEAVER_VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 30); do
            if npm view "@zbeaver/beaver@${BEAVER_VERSION}" version >/dev/null 2>&1; then
              echo "@zbeaver/beaver@${BEAVER_VERSION} is available"
              exit 0
            fi
            echo "Waiting for @zbeaver/beaver@${BEAVER_VERSION} (${attempt}/30)"
            sleep 10
          done
          echo "@zbeaver/beaver@${BEAVER_VERSION} was not available after 5 minutes" >&2
          exit 1

      - name: Install initializer dependencies
        working-directory: create-beaver
        run: npm install

      - name: Test initializer
        working-directory: create-beaver
        run: npm test

      - name: Publish initializer
        working-directory: create-beaver
        run: npm publish
