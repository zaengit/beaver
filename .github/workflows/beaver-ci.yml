name: Beaver CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/beaver-ci.yml"
      - "**"
  pull_request:
    paths:
      - ".github/workflows/beaver-ci.yml"
      - "**"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Build and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Build Beaver package
        run: bun run build

      - name: Verify publishable package contents
        run: npm pack --dry-run --ignore-scripts
